<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Page</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f1f3f6;
}

header{
    background:#2874f0;
    color:white;
    padding:15px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.container{
    width:80%;
    margin:30px auto;
    display:flex;
    background:white;
    padding:20px;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

.image{
    flex:1;
    text-align:center;
}

.image img{
    width:300px;
}

.details{
    flex:2;
    padding-left:30px;
}

h2{
    margin-top:0;
}

.price{
    color:green;
    font-size:28px;
    font-weight:bold;
}

.old-price{
    text-decoration:line-through;
    color:gray;
    margin-left:10px;
}

button{
    padding:12px 25px;
    border:none;
    color:white;
    font-size:16px;
    cursor:pointer;
    margin-right:10px;
    border-radius:5px;
}

.cart{
    background:#ff9f00;
}

.buy{
    background:#fb641b;
}

ul{
    line-height:1.8;
}
</style>

</head>
<body>

<header>
My Shopping Store
</header>

<div class="container">

<div class="image">
<img src="https://via.placeholder.com/300x300.png?text=Product+Image" alt="Product">
</div>

<div class="details">
<h2>Wireless Bluetooth Headphones</h2>

<p class="price">
₹1,499
<span class="old-price">₹2,999</span>
</p>

<p><strong>Rating:</strong> ⭐⭐⭐⭐☆ (4.3)</p>

<h3>Highlights</h3>

<ul>
<li>Bluetooth 5.3</li>
<li>40 Hours Battery Backup</li>
<li>Fast Charging</li>
<li>Noise Cancellation</li>
<li>1 Year Warranty</li>
</ul>

<button class="cart">Add to Cart</button>
<button class="buy">Buy Now</button>

</div>

</div>

</body>
</html>
